<div
  class="bg-gradient-to-r from-indigo-800 to-blue-900 min-h-screen sm:h-full flex items-center justify-center p-4 overflow-auto"
>
  <div class="mt-8 lg:mt-1 w-full flex flex-col items-center justify-around">
    <h1
      class="mb-4 text-4xl font-extrabold leading-none tracking-tight text-gray-900 md:text-5xl lg:text-6xl dark:text-white"
    >
      Informes
    </h1>
    <button
      (click)="descargarIngresosExcel()"
      class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded"
    >
      Descargar ingresos en Excel
    </button>
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-900">
        <tr>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider"
          >
            Especialidad
          </th>
          <th
            class="px-6 py-3 text-left text-xs font-medium text-gray-200 uppercase tracking-wider"
          >
            Cantidad de turnos
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let especialidad of especialidades">
          <td class="px-6 py-4 whitespace-nowrap">{{ especialidad }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            {{ getCantidadTurnos(especialidad.toString()) }}
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
